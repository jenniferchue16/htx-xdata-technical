server {
    listen 80;

    # Look up "backend" through Docker's internal DNS and re-check it every 10 s, so nginx keeps working
    # if the backend container is recreated with a new address
    resolver 127.0.0.11 valid=10s;

    # Serve the built single-page app
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Forward /api/* to the backend with the /api prefix removed (same as Vite's dev proxy)
    location /api/ {
        set $backend_url http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        # nginx's defaults (1 MB uploads, 60 s timeout) are too small for audio files and transcription
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }
}
